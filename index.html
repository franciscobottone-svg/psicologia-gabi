<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lic. Gabriela - Psicóloga Clínica</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F7F9F6; /* Tono crema/verdoso muy relajante */
            color: #333;
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100vh;
            padding: 0 20px;
            background: linear-gradient(to bottom, #E8EFE8, #F7F9F6);
        }
        h1 {
            font-size: 3rem;
            color: #2C4C3B; /* Verde oscuro que da confianza */
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #555;
            max-width: 600px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            background-color: #4A7C59;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background-color: #365D42;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <section class="hero">
